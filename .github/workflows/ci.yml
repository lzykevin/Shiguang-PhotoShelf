name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build.sh
      - name: Verify release configuration
        run: python3 scripts/check_release.py build/Build/Products/Release/PhotoShelf.app
